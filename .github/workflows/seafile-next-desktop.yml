name: Seafile Next desktop builds

on:
  workflow_dispatch:
  push:
    branches:
      - 'seafile-next'
    tags:
      - 'v*-next.*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v4
        with:
          path: seafile-client

      - name: Checkout patched sync core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/seafile
          ref: 09d870896c36e6b09cb4c809c61afa817ca1c83b
          path: seafile

      - name: Checkout libsearpc
        uses: actions/checkout@v4
        with:
          repository: haiwen/libsearpc
          ref: v3.3-latest
          path: libsearpc

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qt5compat qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Install native dependencies
        run: >-
          brew install autoconf automake libtool pkg-config gettext vala
          glib jansson libevent libwebsockets openssl@3 sqlite zlib argon2

      - name: Build libsearpc and sync core
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/usr"
          brew_prefix="$(brew --prefix)"
          export PATH="$(brew --prefix gettext)/bin:$QT_ROOT_DIR/bin:$prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$brew_prefix/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig"
          export CPPFLAGS="-I$prefix/include -I$brew_prefix/include"
          export LDFLAGS="-L$prefix/lib -L$brew_prefix/lib"

          sudo mkdir -p /opt/local/share
          if [[ ! -e /opt/local/share/aclocal ]]; then
            sudo ln -s "$brew_prefix/share/aclocal" /opt/local/share/aclocal
          fi

          cd "$GITHUB_WORKSPACE/libsearpc"
          ./autogen.sh
          ./configure --prefix="$prefix" --disable-compile-demo
          make -j"$(sysctl -n hw.ncpu)"
          make install

          cd "$GITHUB_WORKSPACE/seafile"
          ./autogen.sh
          ./configure --prefix="$prefix" --disable-fuse
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build unsigned macOS application
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/usr"
          brew_prefix="$(brew --prefix)"
          export PATH="$(brew --prefix gettext)/bin:$QT_ROOT_DIR/bin:$prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$brew_prefix/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig"
          export CPPFLAGS="-I$prefix/include -I$brew_prefix/include"
          export LDFLAGS="-L$prefix/lib -L$brew_prefix/lib"

          cmake -S "$GITHUB_WORKSPACE/seafile-client" -B "$GITHUB_WORKSPACE/build-macos" \
            -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_SHIBBOLETH_SUPPORT=ON \
            -DBUILD_SPARKLE_SUPPORT=OFF
          cmake --build "$GITHUB_WORKSPACE/build-macos" --config Release --target seafile-applet --parallel
          "$QT_ROOT_DIR/bin/macdeployqt" "$GITHUB_WORKSPACE/build-macos/Release/seafile-applet.app"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            "$GITHUB_WORKSPACE/build-macos/Release/seafile-applet.app" \
            "$GITHUB_WORKSPACE/dist/seafile-next-9.0.20-macos-arm64-unsigned.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: seafile-client-macos
          path: dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v4
        with:
          path: seafile-client

      - name: Checkout patched sync core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/seafile
          ref: 09d870896c36e6b09cb4c809c61afa817ca1c83b
          path: seafile

      - name: Checkout libsearpc
        uses: actions/checkout@v4
        with:
          repository: haiwen/libsearpc
          ref: v3.3-latest
          path: libsearpc

      - name: Checkout Breakpad
        uses: actions/checkout@v4
        with:
          repository: google/breakpad
          ref: 4febb34583d421e06b8007891d41c6980e29a684
          path: breakpad-gclient/src
          submodules: recursive

      - name: Generate Breakpad Visual Studio projects
        shell: pwsh
        run: |
          $depotTools = "$env:RUNNER_TEMP\depot_tools"
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/chrome-infra/depot_tools.zip' -OutFile depot_tools.zip
          Expand-Archive depot_tools.zip -DestinationPath $depotTools
          $env:PATH = "$depotTools;$env:PATH"
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN = '0'
          $env:GYP_MSVS_VERSION = '2022'
          $env:GYP_DEFINES = 'target_arch=x64'
          git config --global depot-tools.allowGlobalGitConfig false
          git config --global core.autocrlf false
          Push-Location breakpad-gclient
          gclient config https://github.com/google/breakpad --unmanaged --name=src
          gclient sync --nohooks
          python -m pip install gyp-next
          gyp --format=msvs --no-circular-check src/src/client/windows/breakpad_client.gyp
          Pop-Location
          $breakpadRoot = (Resolve-Path breakpad-gclient/src).Path
          New-Item -ItemType Junction -Path breakpad -Target $breakpadRoot | Out-Null

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Install standalone Qt MSBuild support
        shell: pwsh
        run: |
          $url = 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip'
          Invoke-WebRequest -Uri $url -OutFile qt-msbuild.zip
          Expand-Archive qt-msbuild.zip -DestinationPath qt-msbuild
          $qtMsBuild = (Get-ChildItem qt-msbuild -Recurse -Filter qt.targets | Select-Object -First 1).Directory.FullName
          "QT_MSBUILD=$qtMsBuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Enable vcpkg manifest integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Build Breakpad
        shell: pwsh
        run: |
          $properties = @('/m', '/p:Configuration=Release', '/p:Platform=x64', '/p:PlatformToolset=v143')
          msbuild breakpad/src/client/windows/common.vcxproj @properties
          msbuild breakpad/src/client/windows/crash_generation/crash_generation_client.vcxproj @properties
          msbuild breakpad/src/client/windows/handler/exception_handler.vcxproj @properties

      - name: Build libsearpc and sync core
        shell: pwsh
        run: |
          msbuild libsearpc/libsearpc.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:VcpkgEnableManifest=true
          msbuild seafile/seafile.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:VcpkgEnableManifest=true

      - name: Build GUI
        shell: pwsh
        run: |
          msbuild seafile-client/seafile-client.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:QtMsBuild="$env:QT_MSBUILD" /p:QtInstall="$env:QT_ROOT_DIR" /p:VcpkgEnableManifest=true

      - name: Assemble unsigned portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item seafile-client/x64/Release/seafile-applet.exe dist/windows/
          Copy-Item seafile/x64/Release/seaf-daemon.exe dist/windows/
          Copy-Item libsearpc/x64/Release/libsearpc.dll dist/windows/
          Copy-Item seafile/x64/Release/*.dll dist/windows/ -ErrorAction SilentlyContinue
          Get-ChildItem -Path seafile-client/vcpkg_installed -Recurse -Filter *.dll | Copy-Item -Destination dist/windows -Force
          Get-ChildItem -Path seafile/vcpkg_installed -Recurse -Filter *.dll | Copy-Item -Destination dist/windows -Force
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-compiler-runtime dist/windows/seafile-applet.exe
          Compress-Archive -Path dist/windows/* -DestinationPath dist/seafile-next-9.0.20-windows-x64-unsigned.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: seafile-client-windows
          path: dist/*.zip
          if-no-files-found: error
